<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Playground - BlueTEXT.in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <nav class="nav-container">
      <a href="/" class="logo"><img src="/assets/logo.svg" alt="BlueTEXT.in" height="32"></a>
      <ul class="nav-links">
        <li><a href="/courses/index.html">Courses</a></li>
        <li><a href="/tools/index.html" class="active">Tools</a></li>
        <li><a href="/shop/index.html">Shop</a></li>
        <li><a href="/blog/index.html">Blog</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main class="main-content">
    <section class="tool-hero">
      <h1>Code Playground</h1>
      <p>Write and run HTML, CSS, and JavaScript code live in your browser.</p>
    </section>
    <section class="playground-section">
      <textarea id="html-code" rows="6" placeholder="HTML"></textarea>
      <textarea id="css-code" rows="6" placeholder="CSS"></textarea>
      <textarea id="js-code" rows="6" placeholder="JavaScript"></textarea>
      <button onclick="runPlayground()" class="btn">Run</button>
      <iframe id="playground-frame" style="width:100%;height:300px;border:1px solid #ccc;margin-top:1em;"></iframe>
    </section>
    <script>
      function runPlayground() {
        const html = document.getElementById('html-code').value;
        const css = document.getElementById('css-code').value;
        const js = document.getElementById('js-code').value;
        const frame = document.getElementById('playground-frame');
        const code = `<!DOCTYPE html><html><head><style>${css}</style></head><body>${html}<script>${js}<\/script></body></html>`;
        frame.srcdoc = code;
      }
    </script>
  </main>
  <footer class="footer">
    <p>© 2024 BlueTEXT.in</p>
  </footer>
</body>
</html>
