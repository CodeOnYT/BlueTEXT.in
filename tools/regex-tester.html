<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Tester - BlueTEXT.in</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <a href="/" class="logo"><img src="/assets/logo.svg" alt="BlueTEXT.in" height="32"></a>
            <ul class="nav-links">
                <li><a href="/tools/index.html">Tools</a></li>
                <li><a href="/courses/index.html">Courses</a></li>
                <li><a href="/portfolio.html">Portfolio</a></li>
                <li><a href="/blog/index.html">Blog</a></li>
                <li><a href="/contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="main-content">
        <section class="tool-section">
            <h1>Regex Tester</h1>
            <p>Test your regular expressions against sample text.</p>
            <input id="regex-input" type="text" placeholder="Enter regex..." style="width:60%">
            <textarea id="test-input" rows="6" placeholder="Enter test text..."></textarea>
            <div>
                <button onclick="testRegex()" class="btn">Test</button>
            </div>
            <pre id="regex-output" class="regex-output"></pre>
        </section>
    </main>
    <footer class="footer">
        <p>© 2024 BlueTEXT.in</p>
    </footer>
    <script>
    function testRegex() {
        const regexStr = document.getElementById('regex-input').value;
        const testStr = document.getElementById('test-input').value;
        const output = document.getElementById('regex-output');
        try {
            const regex = new RegExp(regexStr, 'g');
            const matches = testStr.match(regex);
            output.textContent = matches ? matches.join('\n') : 'No matches found.';
            output.style.color = '#222';
        } catch (e) {
            output.textContent = 'Invalid regex: ' + e.message;
            output.style.color = 'red';
        }
    }
    </script>
</body>
</html>
