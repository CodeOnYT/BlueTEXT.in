<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Tool - BlueTEXT.in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <nav class="nav-container">
      <a href="/" class="logo"><img src="/assets/logo.svg" alt="BlueTEXT.in" height="32"></a>
      <ul class="nav-links">
        <li><a href="/courses/index.html">Courses</a></li>
        <li><a href="/tools/index.html" class="active">Tools</a></li>
        <li><a href="/shop/index.html">Shop</a></li>
        <li><a href="/blog/index.html">Blog</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main class="main-content">
    <section class="tool-hero">
      <h1>Calculator</h1>
      <p>Simple calculator for quick math operations.</p>
    </section>
    <section class="calculator-section">
      <input type="text" id="calc-display" readonly style="width:100%;font-size:1.5em;text-align:right;margin-bottom:1em;">
      <div class="calc-buttons">
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('/')">÷</button><br>
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('*')">×</button><br>
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('-')">−</button><br>
        <button onclick="press('0')">0</button>
        <button onclick="press('.')">.</button>
        <button onclick="calculate()">=</button>
        <button onclick="press('+')">+</button><br>
        <button onclick="clearCalc()">C</button>
      </div>
    </section>
    <script>
      let calcValue = '';
      function press(val) {
        calcValue += val;
        document.getElementById('calc-display').value = calcValue;
      }
      function calculate() {
        try {
          calcValue = eval(calcValue).toString();
        } catch {
          calcValue = 'Error';
        }
        document.getElementById('calc-display').value = calcValue;
      }
      function clearCalc() {
        calcValue = '';
        document.getElementById('calc-display').value = '';
      }
    </script>
  </main>
  <footer class="footer">
    <p>© 2024 BlueTEXT.in</p>
  </footer>
</body>
</html>
