<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator - BlueTEXT.in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <nav class="nav-container">
      <a href="/" class="logo"><img src="/assets/logo.svg" alt="BlueTEXT.in" height="32"></a>
      <ul class="nav-links">
        <li><a href="/tools/index.html" class="active">Tools</a></li>
        <li><a href="/courses/index.html">Courses</a></li>
        <li><a href="/shop/index.html">Shop</a></li>
        <li><a href="/blog/index.html">Blog</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main class="main-content">
    <section class="tool-hero">
      <h1>Password Generator</h1>
      <p>Generate strong, random passwords for your accounts.</p>
    </section>
    <section class="password-section">
      <label for="pw-length">Length:</label>
      <input type="number" id="pw-length" value="12" min="6" max="32">
      <button onclick="generatePassword()" class="btn">Generate</button>
      <input type="text" id="pw-output" readonly style="width:60%;margin-top:1em;">
      <button onclick="copyPassword()" class="btn">Copy</button>
    </section>
    <script>
      function generatePassword() {
        const length = parseInt(document.getElementById('pw-length').value);
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+';
        let pw = '';
        for(let i=0;i<length;i++) {
          pw += chars.charAt(Math.floor(Math.random()*chars.length));
        }
        document.getElementById('pw-output').value = pw;
      }
      function copyPassword() {
        const pw = document.getElementById('pw-output');
        pw.select();
        document.execCommand('copy');
      }
    </script>
  </main>
  <footer class="footer">
    <p>© 2024 BlueTEXT.in</p>
  </footer>
</body>
</html>
