<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Editor - BlueTEXT.in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <nav class="nav-container">
      <a href="/" class="logo"><img src="/assets/logo.svg" alt="BlueTEXT.in" height="32"></a>
      <ul class="nav-links">
        <li><a href="/tools/index.html" class="active">Tools</a></li>
        <li><a href="/courses/index.html">Courses</a></li>
        <li><a href="/shop/index.html">Shop</a></li>
        <li><a href="/blog/index.html">Blog</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main class="main-content">
    <section class="tool-hero">
      <h1>Markdown Editor</h1>
      <p>Write and preview Markdown in real time.</p>
    </section>
    <section class="markdown-section">
      <textarea id="md-input" rows="10" placeholder="Type Markdown here..."></textarea>
      <button onclick="renderMarkdown()" class="btn">Preview</button>
      <div id="md-preview" class="md-preview" style="border:1px solid #ccc;padding:1em;margin-top:1em;"></div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      function renderMarkdown() {
        const input = document.getElementById('md-input').value;
        document.getElementById('md-preview').innerHTML = marked.parse(input);
      }
    </script>
  </main>
  <footer class="footer">
    <p>© 2024 BlueTEXT.in</p>
  </footer>
</body>
</html>
