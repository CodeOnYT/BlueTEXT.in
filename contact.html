<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - BlueTEXT.in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <nav class="nav-container">
      <a href="/" class="logo"><img src="/assets/logo.svg" alt="BlueTEXT.in" height="32"></a>
      <ul class="nav-links">
        <li><a href="/courses/index.html">Courses</a></li>
        <li><a href="/tools/index.html">Tools</a></li>
        <li><a href="/shop/index.html">Shop</a></li>
        <li><a href="/blog/index.html">Blog</a></li>
        <li><a href="/resources.html">Resources</a></li>
        <li><a href="/faq.html">FAQ</a></li>
        <li><a href="/testimonials.html">Testimonials</a></li>
        <li><a href="/quiz.html">Quiz</a></li>
        <li><a href="/community.html">Community</a></li>
        <li><a href="/contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main class="main-content">
    <section class="contact-hero">
      <h1>Contact Us</h1>
      <p>Have questions, feedback, or partnership ideas? Reach out to us below.</p>
    </section>
    <section class="contact-form-section">
      <form id="contact-form" action="mailto:support@bluetext.in" method="POST" enctype="text/plain">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" required></textarea><br>
        <button type="submit" class="btn">Send Message</button>
      </form>
      <div class="contact-info">
        <p>Email: <a href="mailto:support@bluetext.in">support@bluetext.in</a></p>
        <p>Twitter: <a href="https://twitter.com/Tulsiram_Methre" target="_blank">@Tulsiram_Methre</a></p>
        <p>GitHub: <a href="https://github.com/CodeOnYT" target="_blank">CodeOnYT</a></p>
      </div>
    </section>
  </main>
  <footer class="footer">
    <p>© 2024 BlueTEXT.in</p>
  </footer>
</body>
</html>
