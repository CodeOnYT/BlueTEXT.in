<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe - BlueTEXT.in</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .board { display: grid; grid-template-columns: repeat(3, 60px); grid-gap: 5px; margin: 2em auto; }
    .cell { width: 60px; height: 60px; font-size: 2em; text-align: center; background: #f0f0f0; cursor: pointer; }
  </style>
</head>
<body>
  <header class="header">
    <nav class="nav-container">
      <a href="/games/index.html">Back to Games</a>
    </nav>
  </header>
  <main class="main-content">
    <h1>Tic Tac Toe</h1>
    <div class="board" id="board"></div>
    <div id="status" style="margin-top:1em;font-weight:bold;"></div>
    <button onclick="resetGame()" class="btn">Restart</button>
    <script>
      let board = Array(9).fill('');
      let current = 'X';
      let gameOver = false;
      function render() {
        const b = document.getElementById('board');
        b.innerHTML = '';
        board.forEach((cell, i) => {
          const d = document.createElement('div');
          d.className = 'cell';
          d.textContent = cell;
          d.onclick = () => move(i);
          b.appendChild(d);
        });
        document.getElementById('status').textContent = gameOver ? (winner() ? winner() + ' wins!' : 'Draw!') : current + "'s turn";
      }
      function move(i) {
        if (board[i] || gameOver) return;
        board[i] = current;
        if (winner() || board.every(c => c)) gameOver = true;
        current = current === 'X' ? 'O' : 'X';
        render();
      }
      function winner() {
        const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for (let line of w) {
          const [a,b,c] = line;
          if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
        }
        return null;
      }
      function resetGame() {
        board = Array(9).fill('');
        current = 'X';
        gameOver = false;
        render();
      }
      render();
    </script>
  </main>
  <footer class="footer">
    <p>© 2024 BlueTEXT.in</p>
  </footer>
</body>
</html>
