<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Game - BlueTEXT.in</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { font-family: sans-serif; }
    .game-container { max-width: 350px; margin: 2em auto; }
    .board-2048 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .cell-2048 { background: #eee; font-size: 2em; text-align: center; height: 60px; line-height: 60px; border-radius: 6px; }
    @media (max-width: 500px) {
      .game-container { max-width: 98vw; }
      .cell-2048 { height: 14vw; line-height: 14vw; font-size: 6vw; }
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="nav-container">
      <a href="/games/index.html">Back to Games</a>
    </nav>
  </header>
  <main class="main-content">
    <div class="game-container">
      <h1>2048</h1>
      <div class="board-2048" id="board"></div>
      <div id="score" style="margin-top:1em;font-weight:bold;"></div>
      <button onclick="resetGame()" class="btn">Restart</button>
    </div>
    <script>
      let board, score;
      function init() {
        board = Array(16).fill(0);
        score = 0;
        addTile(); addTile();
        render();
      }
      function addTile() {
        let empty = board.map((v,i)=>v===0?i:null).filter(v=>v!==null);
        if(empty.length) board[empty[Math.floor(Math.random()*empty.length)]] = Math.random()<0.9?2:4;
      }
      function render() {
        const b = document.getElementById('board');
        b.innerHTML = '';
        board.forEach(v => {
          const d = document.createElement('div');
          d.className = 'cell-2048';
          d.textContent = v||'';
          b.appendChild(d);
        });
        document.getElementById('score').textContent = 'Score: '+score;
      }
      function move(dir) {
        let moved = false;
        let rows = [0,4,8,12];
        let cols = [0,1,2,3];
        function slide(arr) {
          let vals = arr.map(i=>board[i]).filter(v=>v);
          for(let i=0;i<vals.length-1;i++){
            if(vals[i]===vals[i+1]){vals[i]*=2;score+=vals[i];vals[i+1]=0;}
          }
          vals = vals.filter(v=>v);
          while(vals.length<4)vals.push(0);
          return vals;
        }
        if(dir==='Left'){
          rows.forEach(r=>{let s=slide([r,r+1,r+2,r+3]);for(let i=0;i<4;i++)if(board[r+i]!==s[i]){board[r+i]=s[i];moved=true;}});
        }
        if(dir==='Right'){
          rows.forEach(r=>{let s=slide([r+3,r+2,r+1,r]);s.reverse();for(let i=0;i<4;i++)if(board[r+i]!==s[i]){board[r+i]=s[i];moved=true;}});
        }
        if(dir==='Up'){
          cols.forEach(c=>{let s=slide([c,c+4,c+8,c+12]);for(let i=0;i<4;i++)if(board[c+i*4]!==s[i]){board[c+i*4]=s[i];moved=true;}});
        }
        if(dir==='Down'){
          cols.forEach(c=>{let s=slide([c+12,c+8,c+4,c]);s.reverse();for(let i=0;i<4;i++)if(board[c+i*4]!==s[i]){board[c+i*4]=s[i];moved=true;}});
        }
        if(moved){addTile();render();}
      }
      document.addEventListener('keydown',e=>{
        if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))move(e.key.replace('Arrow',''));
      });
      function resetGame(){init();}
      init();
    </script>
  </main>
  <footer class="footer">
    <p>© 2024 BlueTEXT.in</p>
  </footer>
</body>
</html>
